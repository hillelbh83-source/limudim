  <script>
    (function () {
      try {
        var raw = localStorage.getItem('StudyMaster_user_settings_v1');
        var settings = raw ? JSON.parse(raw) : {};
        var mode = settings.themeMode || settings.theme || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
        document.documentElement.dataset.themeId = settings.activeThemeId || 'default';
      } catch (_) {}
    })();
  </script>
  <style>
    html,body,#root{height:100%;margin:0;background:#f6f4ef;overflow:hidden}
    html.dark,html.dark body,html.dark #root{background:#0b0f14}
    .android-boot{position:fixed;inset:0;display:grid;place-items:center;background:inherit;transition:opacity .17s ease;z-index:99999}
    .android-boot--hide{opacity:0;pointer-events:none}
    .android-boot svg{width:76px;height:76px;filter:drop-shadow(0 16px 26px rgba(7,26,51,.22))}
    @media(prefers-reduced-motion:reduce){.android-boot{transition-duration:.08s}}
  </style>
